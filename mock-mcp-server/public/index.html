<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AirenoOS Mock MCP — Inspector</title>
  <!-- SweetAlert2 (v11): themed modal + toast — replaces native confirm()/alert() -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2129;
      --panel-2: #232c36;
      --border: #2d3741;
      --text: #d6deeb;
      --muted: #7a8597;
      --accent: #7fdbff;
      --accent-2: #82aaff;
      --autocad: #d9a157;
      --bricscad: #6ec77a;
      --revit: #c878d4;
      --danger: #ff5874;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    header .info { color: var(--muted); font-size: 13px; }
    header .spacer { flex: 1; }
    header button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    header button:hover { background: var(--border); }
    header button.danger { color: var(--danger); }

    /* Source filter chips */
    .filters {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-left: 16px;
    }
    .filter-chip {
      background: var(--panel-2);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      user-select: none;
    }
    .filter-chip:hover { background: var(--border); color: var(--text); }
    .filter-chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .filter-chip .count {
      display: inline-block;
      margin-left: 4px;
      padding: 0 6px;
      background: rgba(0,0,0,0.25);
      border-radius: 8px;
      font-weight: 500;
    }
    .filter-chip.active .count { background: rgba(0,0,0,0.4); }
    /* Per-source chip tinting (visible only when NOT active) */
    .filter-chip[data-src="autocad"]:not(.active)  { border-color: rgba(217,161,87,0.4);  color: var(--autocad); }
    .filter-chip[data-src="bricscad"]:not(.active) { border-color: rgba(110,199,122,0.4); color: var(--bricscad); }
    .filter-chip[data-src="revit"]:not(.active)    { border-color: rgba(200,120,212,0.4); color: var(--revit); }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .list-pane {
      width: 360px;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      background: var(--panel);
    }
    .list-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .list-item:hover { background: var(--panel-2); }
    .list-item.active { background: var(--panel-2); border-left: 3px solid var(--accent); padding-left: 13px; }
    .list-item .source {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-right: 6px;
    }
    .source.autocad  { background: rgba(217,161,87,0.2);  color: var(--autocad); }
    .source.bricscad { background: rgba(110,199,122,0.2); color: var(--bricscad); }
    .source.revit    { background: rgba(200,120,212,0.2); color: var(--revit); }
    .source.unknown  { background: rgba(122,133,151,0.2); color: var(--muted); }
    .list-item .time {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }
    .list-item .stats {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .detail-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .detail-header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .detail-header h2 { margin: 0 0 4px 0; font-size: 15px; font-weight: 500; }
    .detail-header .meta { color: var(--muted); font-size: 12px; }
    .detail-content {
      flex: 1;
      overflow: auto;
      padding: 16px 20px;
    }
    pre {
      margin: 0;
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    /* JSON tree viewer */
    .json-tree {
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .json-content { padding-left: 18px; }
    .json-toggle {
      cursor: pointer;
      user-select: none;
      color: var(--muted);
      display: inline-block;
      width: 12px;
      text-align: center;
      margin-right: 2px;
      font-size: 10px;
      transition: color 0.1s, transform 0.15s;
    }
    .json-toggle:hover { color: var(--accent); }
    .json-collapsed-info {
      color: var(--muted);
      font-style: italic;
      padding: 0 4px;
    }

    /* JSON syntax coloring */
    .j-key   { color: var(--accent-2); }
    .j-str   { color: #c3e88d; }
    .j-num   { color: #f78c6c; }
    .j-bool  { color: #ff5874; }
    .j-null  { color: var(--muted); }
    .j-punct { color: var(--text); }

    .detail-tools {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .detail-tools button {
      background: var(--panel-2);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
    }
    .detail-tools button:hover { background: var(--border); color: var(--text); }

    .confirm-btn {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 8px;
      border-radius: 10px;
      background: rgba(127,219,255,0.12);
      color: var(--accent);
      border: 1px solid rgba(127,219,255,0.35);
      cursor: pointer;
      font-size: 11px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .confirm-btn:hover { background: rgba(127,219,255,0.25); }
  </style>
</head>
<body>
  <header>
    <h1>AirenoOS Mock MCP Inspector</h1>
    <span class="info" id="status">connecting…</span>
    <div class="filters" id="filters">
      <span class="filter-chip active" data-src="all">All<span class="count" id="count-all">0</span></span>
      <span class="filter-chip" data-src="autocad">AutoCAD<span class="count" id="count-autocad">0</span></span>
      <span class="filter-chip" data-src="bricscad">BricsCAD<span class="count" id="count-bricscad">0</span></span>
      <span class="filter-chip" data-src="revit">Revit<span class="count" id="count-revit">0</span></span>
    </div>
    <span class="spacer"></span>
    <button id="refresh">Refresh</button>
    <button id="clear" class="danger">Clear all</button>
  </header>
  <main>
    <aside class="list-pane" id="list"></aside>
    <section class="detail-pane">
      <div class="detail-header" id="detail-header" style="display:none">
        <h2 id="detail-title"></h2>
        <div class="meta" id="detail-meta"></div>
        <div class="detail-tools">
          <button id="expand-all">Expand all</button>
          <button id="collapse-all">Collapse all</button>
          <button id="collapse-objects">Collapse all groups</button>
          <button id="copy-json">Copy JSON</button>
        </div>
      </div>
      <div class="detail-content">
        <div id="detail" class="empty">Select a payload from the list to inspect.</div>
      </div>
    </section>
  </main>

  <script>
    const els = {
      list: document.getElementById('list'),
      detail: document.getElementById('detail'),
      detailHeader: document.getElementById('detail-header'),
      detailTitle: document.getElementById('detail-title'),
      detailMeta: document.getElementById('detail-meta'),
      status: document.getElementById('status'),
      refresh: document.getElementById('refresh'),
      clear: document.getElementById('clear'),
      expandAll: document.getElementById('expand-all'),
      collapseAll: document.getElementById('collapse-all'),
      collapseObjects: document.getElementById('collapse-objects'),
      copyJson: document.getElementById('copy-json'),
    };

    let selectedId = null;
    let activeFilter = 'all';
    let lastItems = [];

    // Dark-themed SweetAlert2 defaults — matches the inspector palette.
    const SwalDark = Swal.mixin({
      background: '#1a2129',
      color: '#d6deeb',
      confirmButtonColor: '#7fdbff',
      cancelButtonColor: '#2d3741',
      buttonsStyling: true,
    });
    const Toast = Swal.mixin({
      toast: true,
      position: 'top-end',
      showConfirmButton: false,
      timer: 2500,
      timerProgressBar: true,
      background: '#1a2129',
      color: '#d6deeb',
    });

    // Connection state machine — fires toasts only on transitions so a single
    // transient blip doesn't spam the user. Polling interval also backs off
    // (3s healthy → 8s when down) to avoid hammering a failing endpoint.
    let connectionState = 'unknown';  // 'unknown' | 'ok' | 'down'
    let pollTimer = null;
    const POLL_OK_MS   = 3000;
    const POLL_DOWN_MS = 8000;

    async function loadList() {
      try {
        const res = await fetch('/api/payloads');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const items = await res.json();

        if (connectionState === 'down') {
          Toast.fire({ icon: 'success', title: 'Reconnected' });
        }
        connectionState = 'ok';

        lastItems = items;
        updateCounts(items);
        els.status.textContent = `${items.length} payload${items.length === 1 ? '' : 's'}`;
        renderList(applyFilter(items));
      } catch (err) {
        if (connectionState === 'ok' || connectionState === 'unknown') {
          // Only toast on the first failure (transition into 'down').
          Toast.fire({ icon: 'error', title: 'Connection lost' });
        }
        connectionState = 'down';
        els.status.textContent = 'connection error';
      } finally {
        // Reschedule with interval matching current state.
        clearTimeout(pollTimer);
        pollTimer = setTimeout(loadList, connectionState === 'down' ? POLL_DOWN_MS : POLL_OK_MS);
      }
    }

    function updateCounts(items) {
      const counts = { all: items.length, autocad: 0, bricscad: 0, revit: 0 };
      for (const it of items) {
        const src = (it.summary?.source_software || '').toLowerCase();
        if (src in counts) counts[src]++;
      }
      document.getElementById('count-all').textContent = counts.all;
      document.getElementById('count-autocad').textContent = counts.autocad;
      document.getElementById('count-bricscad').textContent = counts.bricscad;
      document.getElementById('count-revit').textContent = counts.revit;
    }

    function applyFilter(items) {
      if (activeFilter === 'all') return items;
      return items.filter((it) =>
        (it.summary?.source_software || '').toLowerCase() === activeFilter
      );
    }

    function renderList(items) {
      if (items.length === 0) {
        const msg = activeFilter === 'all'
          ? 'No payloads received yet.'
          : `No ${activeFilter} payloads.`;
        els.list.innerHTML = `<div class="empty">${msg}</div>`;
        return;
      }
      els.list.innerHTML = items
        .map((it) => {
          const src = (it.summary?.source_software || 'unknown').toLowerCase();
          const time = new Date(it.receivedAt).toLocaleString();
          const stats = [
            it.summary?.total_objects != null ? `${it.summary.total_objects} obj` : null,
            it.summary?.total_rooms ? `${it.summary.total_rooms} rooms` : null,
            it.summary?.total_annotations ? `${it.summary.total_annotations} ann` : null,
            it.summary?.total_dimensions ? `${it.summary.total_dimensions} dim` : null,
            it.summary?.total_hatches ? `${it.summary.total_hatches} hatch` : null,
          ].filter(Boolean).join(' · ');
          const trigger = it.summary?.extraction_trigger || '-';
          return `
            <div class="list-item ${it.id === selectedId ? 'active' : ''}" data-id="${it.id}">
              <div>
                <span class="source ${src}">${src}</span>
                <span>${escapeHtmlText(it.summary?.source_software_version || '')}</span>
              </div>
              <div class="time">${time} · ${trigger}</div>
              <div class="stats">${stats || '—'}</div>
            </div>
          `;
        })
        .join('');
      els.list.querySelectorAll('.list-item').forEach((node) => {
        node.addEventListener('click', () => loadDetail(node.dataset.id));
      });
    }

    // Currently-loaded payload (used by Confirm dialog to read document_project_token).
    let currentPayload = null;

    async function loadDetail(id) {
      selectedId = id;
      Array.from(els.list.children).forEach((n) =>
        n.classList.toggle('active', n.dataset.id === id)
      );
      try {
        const res = await fetch(`/api/payloads/${id}`);
        if (!res.ok) throw new Error('not found');
        const env = await res.json();
        currentPayload = env.payload;
        els.detailHeader.style.display = 'block';
        els.detailTitle.textContent = env.id;
        els.detailMeta.textContent =
          `received ${new Date(env.received_at).toLocaleString()}  ·  ` +
          `from ${env.source_ip || 'unknown'}  ·  ` +
          `token ${env.bearer_token_preview}`;
        els.detail.classList.remove('empty');
        els.detail.classList.add('json-tree');
        els.detail.replaceChildren(renderValue(env.payload, /*isLast*/ true));
      } catch (err) {
        Toast.fire({ icon: 'error', title: 'Failed to load payload' });
      }
    }

    // ── Confirm dialog ───────────────────────────────────────────────────────────
    // Mocks Brian's MCP cockpit "confirm" action: POSTs to /v1/admin/confirm so the
    // plugin's next AIRENO_WRITEBACK call picks up the assigned backpack_id.

    async function openConfirmDialog(objectSignal) {
      const g1 = objectSignal.group_1_identity || {};
      const g2 = objectSignal.group_2_naming || {};
      const docToken = currentPayload?.document_project_token;
      if (!docToken || !g1.native_id) {
        Toast.fire({ icon: 'error', title: 'Missing document_project_token or native_id' });
        return;
      }

      const defaultBackpack = g1.aireno_backpack_id || ('bp-' + Math.random().toString(16).slice(2, 10));
      const defaultLabel = g2.visible_label || g2.definition_name || '';

      const { isConfirmed, value } = await SwalDark.fire({
        title: 'Confirm object → assign backpack_id',
        html:
          `<div style="text-align:left;font-size:12px;color:#7a8597;margin-bottom:10px">
            <code style="color:#82aaff">native_id</code>: <code>${escapeHtmlText(g1.native_id)}</code>
          </div>` +
          `<input id="swal-backpack" class="swal2-input" placeholder="aireno_backpack_id" value="${escapeHtmlText(defaultBackpack)}" />` +
          `<input id="swal-label" class="swal2-input" placeholder="confirmed_label" value="${escapeHtmlText(defaultLabel)}" />` +
          `<input id="swal-room" class="swal2-input" placeholder="confirmed_room_id (optional)" value="" />`,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'Confirm',
        preConfirm: () => ({
          aireno_backpack_id: document.getElementById('swal-backpack').value.trim(),
          confirmed_label:    document.getElementById('swal-label').value.trim(),
          confirmed_room_id:  document.getElementById('swal-room').value.trim() || null,
        }),
      });

      if (!isConfirmed) return;

      try {
        const res = await fetch('/v1/admin/confirm', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            // Bearer required by endpoint; any non-empty token works in dev mode.
            'Authorization': 'Bearer inspector-ui',
          },
          body: JSON.stringify({
            document_project_token: docToken,
            native_id: g1.native_id,
            aireno_backpack_id: value.aireno_backpack_id,
            confirmed_label: value.confirmed_label,
            confirmed_room_id: value.confirmed_room_id,
          }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        Toast.fire({ icon: 'success', title: 'Confirmation stored — plugin can now write back' });
      } catch (err) {
        Toast.fire({ icon: 'error', title: 'Confirm failed: ' + err.message });
      }
    }

    // ── JSON tree renderer with collapsible {} / [] nodes ────────────────────────
    // Each composite node renders as:
    //   ▼ { <content indented> } ,?       (expanded — default)
    //   ▶ { … 8 keys } ,?                  (collapsed)

    function el(tag, cls) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      return e;
    }
    function txt(s, cls) {
      const e = document.createElement('span');
      if (cls) e.className = cls;
      e.textContent = s;
      return e;
    }

    function renderValue(value, isLast, key) {
      if (value === null)               return primitiveLine('null', 'j-null', isLast, key);
      if (typeof value === 'boolean')   return primitiveLine(String(value), 'j-bool', isLast, key);
      if (typeof value === 'number')    return primitiveLine(String(value), 'j-num', isLast, key);
      if (typeof value === 'string')    return primitiveLine(JSON.stringify(value), 'j-str', isLast, key);
      if (Array.isArray(value))         return composite(value, '[', ']', isLast, key, /*isArray*/ true);
      if (typeof value === 'object')    return composite(value, '{', '}', isLast, key, /*isArray*/ false);
      return primitiveLine(String(value), 'j-str', isLast, key);
    }

    function primitiveLine(text, cls, isLast, key) {
      const line = el('div', 'json-line');
      if (key !== undefined) {
        line.appendChild(txt('"' + key + '"', 'j-key'));
        line.appendChild(txt(': ', 'j-punct'));
      }
      line.appendChild(txt(text, cls));
      if (!isLast) line.appendChild(txt(',', 'j-punct'));
      return line;
    }

    function composite(value, openChar, closeChar, isLast, key, isArray) {
      const keys = isArray ? value.map((_, i) => i) : Object.keys(value);
      const wrap = el('div', 'json-line');

      // Key prefix (if this composite is a value in a parent object)
      if (key !== undefined) {
        wrap.appendChild(txt('"' + key + '"', 'j-key'));
        wrap.appendChild(txt(': ', 'j-punct'));
      }

      // Empty case: no toggle, render inline
      if (keys.length === 0) {
        wrap.appendChild(txt(openChar + closeChar, 'j-punct'));
        if (!isLast) wrap.appendChild(txt(',', 'j-punct'));
        return wrap;
      }

      // Toggle handle
      const toggle = el('span', 'json-toggle');
      toggle.textContent = '▼';
      toggle.dataset.expanded = '1';
      wrap.appendChild(toggle);
      wrap.appendChild(txt(openChar, 'j-punct'));

      // If this composite looks like a plugin ObjectSignal (has group_1_identity
      // with non-null native_id), inject a "Confirm" button so the inspector
      // user can mock Brian's MCP cockpit confirmation step.
      if (!isArray && value && value.group_1_identity && value.group_1_identity.native_id) {
        const btn = el('span', 'confirm-btn');
        btn.textContent = 'Confirm';
        btn.title = 'Mark this object confirmed in mock MCP (assigns aireno_backpack_id)';
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          openConfirmDialog(value);
        });
        wrap.appendChild(btn);
      }

      // Collapsed info span — visible only when collapsed
      const summary = txt(
        ` ${keys.length} ${isArray ? 'item' + (keys.length === 1 ? '' : 's') : 'key' + (keys.length === 1 ? '' : 's')} `,
        'json-collapsed-info'
      );
      summary.style.display = 'none';
      wrap.appendChild(summary);

      // Expanded content
      const content = el('div', 'json-content');
      keys.forEach((k, i) => {
        const childIsLast = i === keys.length - 1;
        const child = renderValue(value[k], childIsLast, isArray ? undefined : k);
        content.appendChild(child);
      });
      wrap.appendChild(content);
      wrap.appendChild(txt(closeChar, 'j-punct'));
      if (!isLast) wrap.appendChild(txt(',', 'j-punct'));

      // Toggle behavior
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const expanded = toggle.dataset.expanded === '1';
        toggle.dataset.expanded = expanded ? '0' : '1';
        toggle.textContent = expanded ? '▶' : '▼';
        content.style.display = expanded ? 'none' : 'block';
        summary.style.display = expanded ? 'inline' : 'none';
      });

      return wrap;
    }

    function setAllToggles(expand) {
      els.detail.querySelectorAll('.json-toggle').forEach((t) => {
        const isExpanded = t.dataset.expanded === '1';
        if (isExpanded !== expand) t.click();
      });
    }

    // Used by renderList's innerHTML template (not by the DOM tree renderer).
    function escapeHtmlText(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    document.getElementById('filters').addEventListener('click', (e) => {
      const chip = e.target.closest('.filter-chip');
      if (!chip) return;
      activeFilter = chip.dataset.src;
      document.querySelectorAll('.filter-chip').forEach((c) =>
        c.classList.toggle('active', c === chip)
      );
      renderList(applyFilter(lastItems));
    });

    els.expandAll.addEventListener('click', () => setAllToggles(true));
    els.collapseAll.addEventListener('click', () => setAllToggles(false));
    els.copyJson.addEventListener('click', async () => {
      if (!currentPayload) {
        Toast.fire({ icon: 'warning', title: 'No payload loaded' });
        return;
      }
      const text = JSON.stringify(currentPayload, null, 2);
      try {
        await navigator.clipboard.writeText(text);
        Toast.fire({ icon: 'success', title: `Copied ${text.length.toLocaleString()} chars` });
      } catch (err) {
        // Clipboard API requires HTTPS or localhost; fall back to a hidden textarea hack.
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        Toast.fire(
          ok
            ? { icon: 'success', title: `Copied ${text.length.toLocaleString()} chars` }
            : { icon: 'error', title: 'Copy failed: ' + err.message }
        );
      }
    });
    // "Collapse all groups" = collapse only nodes whose key is group_1_identity .. group_8_quality.
    // Useful for navigating arrays of plugin ObjectSignal where each item has 8 verbose groups.
    els.collapseObjects.addEventListener('click', () => {
      els.detail.querySelectorAll('.json-line').forEach((line) => {
        const keySpan = line.querySelector(':scope > .j-key');
        if (!keySpan) return;
        if (!/^"group_[1-8]_/.test(keySpan.textContent)) return;
        const toggle = line.querySelector(':scope > .json-toggle');
        if (toggle && toggle.dataset.expanded === '1') toggle.click();
      });
    });

    els.refresh.addEventListener('click', loadList);
    els.clear.addEventListener('click', async () => {
      const { isConfirmed } = await SwalDark.fire({
        icon: 'warning',
        title: 'Clear all payloads?',
        text: 'Every received payload will be removed from disk. This cannot be undone.',
        showCancelButton: true,
        confirmButtonText: 'Yes, clear all',
        cancelButtonText: 'Cancel',
        confirmButtonColor: '#ff5874',
        reverseButtons: true,
        focusCancel: true,
      });
      if (!isConfirmed) return;

      try {
        const res = await fetch('/api/payloads', { method: 'DELETE' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        selectedId = null;
        els.detail.textContent = 'Select a payload from the list to inspect.';
        els.detail.classList.add('empty');
        els.detailHeader.style.display = 'none';
        await loadList();
        Toast.fire({ icon: 'success', title: 'All payloads cleared' });
      } catch (err) {
        Toast.fire({ icon: 'error', title: 'Clear failed: ' + err.message });
      }
    });

    // loadList self-reschedules via setTimeout — see connection state machine above.
    loadList();
  </script>
</body>
</html>
